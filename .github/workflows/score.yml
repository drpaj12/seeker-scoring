# Seeker v2.0 scorer. DISABLED until the maintainer enables it (see README "Enabling").
# Safety rules: trigger is `issues: opened` only; never pull_request_target; nothing from the
# issue or a PR is checked out; the issue body reaches the scorer only through an environment
# variable; secrets are passed through env, never interpolated into a shell line.
name: score
on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

concurrency:
  group: score-ledger  # the ledger has one writer at a time
  cancel-in-progress: false

jobs:
  score:
    # ENABLE: replace the next line by
    #   if: contains(github.event.issue.labels.*.name, 'score-request')
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Score the submission
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          SUBMITTER: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
          LEDGER_TOKEN: ${{ secrets.LEDGER_TOKEN }}
          LEDGER_REPO: ${{ secrets.LEDGER_REPO }}
          SEEKER_KEY_PASS: ${{ secrets.SEEKER_KEY_PASS }}
        run: bash scripts/score.sh
