# Seeker v2.0 request staging. The workflow does NOT score: it acknowledges the request and adds
# the `staged` label; the maintainer scores by hand (scripts/score-local.sh) and closes the issue.
# Safety rules: trigger is `issues: opened` only; never pull_request_target; nothing from the
# issue or a PR is checked out or executed; the issue body is never read by this workflow.
name: stage
on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

concurrency:
  group: stage-requests
  cancel-in-progress: false

jobs:
  stage:
    if: contains(github.event.issue.labels.*.name, 'score-request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acknowledge and label
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create staged --force --color FBCA04 \
            --description "Request received, waiting for the maintainer to score it by hand"
          gh issue comment "$ISSUE_NUMBER" --body-file - <<'MSG'
          Request received, staged for the maintainer. Requests are scored by hand, usually within a few days.
          The report is posted here and the issue is then closed. Nothing is scored automatically.
          MSG
          gh issue edit "$ISSUE_NUMBER" --add-label staged
