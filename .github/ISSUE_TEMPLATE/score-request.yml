name: Score a detector
description: Submit a Seeker v2.0 detector output CSV for scoring (see SUBMISSION.md)
title: "[score] "
labels: ["score-request"]
body:
  - type: markdown
    attributes:
      value: |
        Quotas per GitHub account and release: 1 scored submission per 24 hours, 10 in total,
        3 per benchmark, 3 family bundles. A refused submission does not count.
        This issue is a request: the maintainer scores it by hand, usually within a few days, and posts the report here.
        You can also email your CSV to jamieson dit peter at gmail dit com (also the route when your quota is used up).
        Paste the CSV below (header lines, then `id,infected,score,count,locations`), or drag the
        `.csv` / `.txt` file into the box (one file, 8 MB at most). A family bundle is too long to
        paste: GitHub limits an issue body to 65,536 characters, so attach the file.
  - type: textarea
    id: csv
    attributes:
      label: Submission CSV
      description: "Paste the CSV (header lines that start with a hash sign, then the rows), or drag the file into this box."
      render: text
    validations:
      required: true
